<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medusa Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233B5BDB'/%3E%3Cpath d='M9 10h14M9 16h14M9 22h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<header class="top">
  <a class="brand" href="#/" id="brand"><span class="brand-mark" id="brandMark"></span><span class="brand-txt" id="brandName">Medusa Docs</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="Buscar passo, ramo, time… (/)" autocomplete="off">
    <div id="results" hidden></div>
  </div>
  <button class="theme-tgl" id="themeTgl" title="Alternar tema claro/escuro" aria-label="Alternar tema"><span class="sun">☀</span><span class="moon">☾</span></button>
  <a class="docs-btn" id="docsBtn" href="#/docs" title="Documentação da plataforma">📖 <span>Docs</span></a>
  <div id="usermenu"></div>
</header>
<nav id="tabbar" class="tabbar" aria-label="Abas abertas"></nav>
<main id="view"></main>
<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-live="polite">
  <div class="dhead">
    <button id="dback" title="Voltar">←</button>
    <div id="dtitle"></div>
    <button id="dclose" title="Fechar (Esc)">✕</button>
  </div>
  <div id="dbody"></div>
</aside>
<script src="flow.js"></script>
<script src="editor.js"></script>
<script src="docs.js"></script>
<script src="app.js"></script>
</body>
</html>
