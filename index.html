    <button class="side-close" id="sideClose" title="Fechar menu (Esc)" aria-label="Fechar menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426"/></svg></button></div>

  </div>
  <nav class="side-nav" id="sideNav"></nav>

</aside>

</div>

    <div id="dtitle"></div>
    <button id="dclose" title="Fechar (Esc)" aria-label="Fechar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6.75827 17.2426L12.0009 12M17.2435 6.75736L12.0009 12M12.0009 12L6.75827 6.75736M12.0009 12L17.2435 17.2426"/></svg></button>
  </div>
  <div id="dbody"></div>
</aside>
